    <style>
        :root {
            --bg-color: #fcf9f2;

            --border-color: #d1c7b7;
            --card-bg: #f7f3eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
            line-height: 1.5;
            padding: 10px 5px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            padding: 20px 15px;
            background-color: #fffdf9;
            box-shadow: 0 0 15px rgba(0,0,0,0.03);
            border-radius: 4px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            font-family: 'Montserrat', sans-serif;
        }

        .lang-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 3px;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .lang-btn.active, .lang-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            margin-top: -2px;
            color: #555;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            background: #fff;
            outline: none;
            border-radius: 4px;
            -webkit-appearance: none;
        }

        .nav-categories {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-btn {
            background: none;
            border: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            color: var(--text-color);
            flex-shrink: 0;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .section-title {
            font-size: 26px;
            text-align: center;
            margin: 35px 0 8px;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .epigraph {
            font-style: italic;
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .dish-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 4px;
        }

        .dish-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 18px;
            font-weight: 700;
        }

        .dish-name {
            flex: 0 1 auto;
            padding-right: 5px;
        }

        .dots {
            flex: 1;
            border-bottom: 1px dotted var(--text-color);
            margin: 0 5px 4px;
            min-width: 15px;
        }

        .dish-price {
            font-weight: 700;
            color: var(--accent-color);
            white-space: nowrap;
            font-size: 17px;
        }

        .recommendation {
            font-size: 13px;
            font-style: italic;
            color: #666;
            margin-top: 4px;
        }

        .footer-note {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid var(--text-color);
            font-style: italic;
            font-size: 16px;
        }
    </style>
</head>

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
    });
    document.getElementById('searchInput').placeholder = labels[lang].searchPlaceholder;
    document.getElementById('footerNote').innerText = labels[lang].footer;
    renderMenu();
}

function renderMenu() {
    const nav = document.getElementById('categoriesNav');
    const content = document.getElementById('menuContent');
    nav.innerHTML = '';
    content.innerHTML = '';

    menuData.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.innerText = cat.category[currentLang];
        btn.onclick = () => document.getElementById(`cat-${idx}`).scrollIntoView({ behavior: 'smooth' });
        nav.appendChild(btn);

        const section = document.createElement('div');
        section.id = `cat-${idx}`;
        
        let html = `<div class="section-title">${cat.category[currentLang]}</div>`;
        if (cat.epigraph && cat.epigraph[currentLang]) {
            html += `<div class="epigraph">${cat.epigraph[currentLang]}</div>`;
        }
        
        html += `<div class="menu-grid">`;
        cat.items.forEach(dish => {
            const recText = dish.rec ? dish.rec[currentLang] : null;
            html += `
                <div class="dish-card">
                    <div class="dish-header">
                        <span class="dish-name">${dish.name[currentLang]}</span>
                        <span class="dots"></span>
                        <span class="dish-price">${dish.price}</span>
                    </div>
                    ${recText ? `<div class="recommendation">(${recText})</div>` : ''}
                </div>
            `;
        });
        html += `</div>`;
        section.innerHTML = html;
        content.appendChild(section);
    });
}

function filterDishes() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.dish-card');
    cards.forEach(card => {
        const name = card.querySelector('.dish-name').innerText.toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
    });
}

renderMenu();
